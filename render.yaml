# Render Web Services Configuration
services:
  - type: web
    name: linksutra-backend
    env: python
    plan: free
    buildCommand: |
      cd backend
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      cd backend
      uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://linksutra-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://linksutra-frontend.onrender.com

  - type: web
    name: linksutra-frontend
    env: static
    plan: free
    buildCommand: |
      cd frontend
      npm install
      npm run build
    publishPath: ./frontend/dist
    routes:
      - path: /*
        match: none
        dest: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://linksutra-backend.onrender.com

databases:
  - name: linksutra-db
    databaseName: linksutra
    user: linksutra_user
    plan: free